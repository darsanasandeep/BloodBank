<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css'>

    <script src='https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js'></script>
    <style>
        .hbody{
            margin-top:20px;
            color: #1a202c;
            text-align: left;
            background-color: #e2e8f0;
        }
        .main-body {
            padding: 15px;
        }
        .card {
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px 0 rgba(0,0,0,.06);
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            word-wrap: break-word;
            background-color: #fff;
            background-clip: border-box;
            border: 0 solid rgba(0,0,0,.125);
            border-radius: .25rem;
        }

        .card-body {
            flex: 1 1 auto;
            min-height: 1px;
            padding: 1rem;
        }

        .gutters-sm {
            margin-right: -8px;
            margin-left: -8px;
        }

        .gutters-sm>.col, .gutters-sm>[class*=col-] {
            padding-right: 8px;
            padding-left: 8px;
        }
        .mb-3, .my-3 {
            margin-bottom: 1rem!important;
        }

        .bg-gray-300 {
            background-color: #e2e8f0;
        }
        .h-100 {
            height: 100%!important;
        }
        .shadow-none {
            box-shadow: none!important;
        }
    </style>
</head>
<body class="hbody">
    <div class="container">
    <div class="main-body">
          <div class="row gutters-sm">
            <div class="col-md-2 mb-3">
            </div>
              <div class="col-lg-9">
				  <form method="post" action="/updaterequest/{{data.id}}">
    				{% csrf_token %}
						<div class="card">
							<div class="card-body">
								<div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Full Name</h6>
									</div>
									<div class="col-sm-4 text-secondary">
										<input type="text" name="fname" class="form-control" value="{{ data.name }}">
									</div>
									<div class="col-sm-1">
										<h6 class="mb-0">Age</h6>
									</div>
									<div class="col-sm-4 text-secondary">
										<input type="text" name="age" class="form-control" value="{{data.age}}">
									</div>
								</div>

								<div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Email</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="text" name="email" class="form-control" value="{{data.email}}">
									</div>
								</div>
								<div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Mobile</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="text" name="phone" class="form-control" value="{{data.mobile_number}}">
									</div>
								</div>
								<div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Address</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="text" name="addrs" class="form-control" value="{{data.address}}">
									</div>
								</div>
								<div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Gender</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="text" name="gender" class="form-control" value="{{data.gender}}">
									</div>
								</div>
								<div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Health</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="text" name="health" class="form-control" value="{{data.health_issue}}">
									</div>
								</div>
								<div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Blood Group</h6>
									</div>
									<div class="col-sm-4 text-secondary">
										<select name="group" class="form-control">
											<option value="A+" {% if data.blood_type == "A+" %}selected{% endif %}>A+</option>
											<option value="A-" {% if data.blood_type == "A-" %}selected{% endif %}>A-</option>
											<option value="B+" {% if data.blood_type == "B+" %}selected{% endif %}>B+</option>
											<option value="B-" {% if data.blood_type == "B-" %}selected{% endif %}>B-</option>
											<option value="O+" {% if data.blood_type == "O+" %}selected{% endif %}>O+</option>
											<option value="O-" {% if data.blood_type == "O-" %}selected{% endif %}>O-</option>
											<option value="AB+" {% if data.blood_type == "AB+" %}selected{% endif %}>AB+</option>
											<option value="AB-" {% if data.blood_type == "AB-" %}selected{% endif %}>AB-</option>
										</select>
									</div>
								</div>

								<div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Quantity</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="text" name="qunty" class="form-control" value="{{data.quantity}}">
									</div>
								</div>
                                <div class="row mb-3">
                                      <div class="col-sm-3">
                                          <h6 class="mb-0">Status</h6>
                                      </div>
                                      <div class="col-sm-9 text-secondary">
                                          <input type="text" name="status" class="form-control" value="{{data.status}}">
                                      </div>
                                  </div>
								<div class="row">
                                    <div class="col-sm-3"></div>
                                    <div class="col-sm-9 text-secondary">
                                        <input type="submit" class="btn btn-success px-4" value="Save Changes"
										   style="pointer-events: {% if data.status == 'PENDING' %}auto{% else %}none{% endif %};
												  opacity: {% if data.status == 'PENDING' %}1{% else %}0.5{% endif %};">
                                        <a href="/requestlist" class="btn btn-secondary px-4" role="button">CANCEL</a>
                                    </div>
								</div>
							</div>
						</div>
				  </form>
          </div>
    </div>
    </div>
</body>
</html>
