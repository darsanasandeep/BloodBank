<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Web Component</title>
    {% load static %}
    <link href="{% static 'style.css'%}" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js'></script>
</head>
    <body>
        <div class="container">
            <!-- Breadcrumb -->
              <nav aria-label="breadcrumb" class="main-breadcrumb">
                <ol class="breadcrumb">
                  <li class="breadcrumb-item"><a href="/userhome">Home</a></li>
                  <li class="breadcrumb-item"><a href="/requestlist">Request List</a></li>
                </ol>
              </nav><br><br>
              <!-- /Breadcrumb -->
            <div class="controls">
              <a href="request" class="filter-btn" style="text-decoration: none; background-color: blue; color: white; padding: 10px 15px; border-radius: 5px; display: inline-flex; align-items: center;">
                   New Request <i class="fa fa-plus" style="margin-left: 5px;"></i>
              </a>
          </div>
            <div class="table-container">
                <table class="table">
                    <thead class="table-header">
                        <tr class="table-header-row">
                            <th class="key-heading">No.</th>
                            <th class="price-heading">Blood group</th>
                            <th class="status-heading">Quantity</th>
                            <th class="status-heading">Purpose</th>
                            <th class="price-heading">Status</th>
                            <th class="price-heading">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for data in datas %}
                            <tr>
                                <td>{{ data.id }}</td>
                                <td>{{ data.blood_type }}</td>
                                <td>{{ data.quantity }}</td>
                                <td>{{ data.health_issue }}</td>
                                <td>
                                    <span
                                        style="color: {% if data.status == 'Approved' %} green
                                                    {% elif data.status == 'Rejected' %} red
                                                    {% else %} #d1a819
                                                    {% endif %};">
                                        {{ data.status|title }}
                                    </span>
                                </td>
                                <td>

                                    <a href="/detailedreqt/{{ data.id }}" class="filter-btn">View</a>
                                    <a href="{% if data.status == 'Pending' %}#{% else %}/deleterequest/{{ data.id }}{% endif %}"
                                        class="filter-btn"
                                        style="{% if data.status == 'Pending' %}pointer-events: none; opacity: 0.5;{% endif %}">
                                        Delete
                                    </a>
                                </td>

                                </td>
                            </tr>
                        {% endfor %}

                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
