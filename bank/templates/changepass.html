<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css'>

    <script src='https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js'></script>
    <style>
        .hbody{
            margin-top:20px;
            color: #1a202c;
            text-align: left;
            background-color: #e2e8f0;
        }
        .main-body {
            padding: 15px;
        }
        .card {
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px 0 rgba(0,0,0,.06);
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            word-wrap: break-word;
            background-color: #fff;
            background-clip: border-box;
            border: 0 solid rgba(0,0,0,.125);
            border-radius: .25rem;
        }

        .card-body {
            flex: 1 1 auto;
            min-height: 1px;
            padding: 1rem;
        }

        .gutters-sm {
            margin-right: -8px;
            margin-left: -8px;
        }

        .gutters-sm>.col, .gutters-sm>[class*=col-] {
            padding-right: 8px;
            padding-left: 8px;
        }
        .mb-3, .my-3 {
            margin-bottom: 1rem!important;
        }

        .bg-gray-300 {
            background-color: #e2e8f0;
        }
        .h-100 {
            height: 100%!important;
        }
        .shadow-none {
            box-shadow: none!important;
        }
    </style>
</head>
<body class="hbody">
    <div class="container">
    <div class="main-body">

          <!-- Breadcrumb -->
          <nav aria-label="breadcrumb" class="main-breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="{% if user.is_superuser %}/adminhome{% else %}/userhome{% endif %}">Home</a></li>
              <li class="breadcrumb-item"><a href="/changepass">Change Password</a></li>
            </ol>
          </nav>
          <!-- /Breadcrumb -->

          <div class="row gutters-sm">
              <div class="col-lg-8">
				  <form method="post">
    				{% csrf_token %}
                        {% if error_message %}
                            <div style="color: red; margin-bottom: 15px;">
                                {{ error_message }}
                            </div>
                        {% endif %}
						<div class="card">
							<div class="card-body">
                                <div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Old Password</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="password" name="oldpass" class="form-control">
									</div>
								</div>
                              <div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">New Password</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="password" name="newpass" class="form-control" >
									</div>
								</div>
                              <div class="row mb-3">
									<div class="col-sm-3">
										<h6 class="mb-0">Conform Password</h6>
									</div>
									<div class="col-sm-9 text-secondary">
										<input type="password" name="cpass" class="form-control">
									</div>
								</div>
								<div class="row">
									<div class="col-sm-3"></div>
									<div class="col-sm-9 text-secondary">
										<input type="submit" class="btn btn-primary px-4" value="Change Password">
                                        <input type="reset" class="btn btn-warning px-4" value="Reset">
									</div>
								</div>
							</div>
						</div>
				  </form>
          </div>
    </div>
    </div>
</body>
</html>
