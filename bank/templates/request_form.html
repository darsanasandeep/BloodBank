<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Blood Request</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<!-- MATERIAL DESIGN ICONIC FONT -->
		<link rel="stylesheet" href="fonts/material-design-iconic-font/css/material-design-iconic-font.min.css">

		<!-- STYLE static -->
        {% load static %}
        <link href="{% static 'loginstyle.css'%}" rel="stylesheet">
	</head>

	<body>

		<div class="wrapper" style="background-image: url('static/bg.jpg');">
			<div class="inner">
				<form method="post">
					{% csrf_token %}
					<h3>Blood Request</h3>
                    <div class="form-group">
                        <div class="form-wrapper">
                            <label for="fname">Full Name</label>
                            <input name="fname" type="text" class="form-control" required>
                        </div>
                        <div class="form-wrapper">
                            <label for="age">Age</label>
                            <input name="age" type="number" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-wrapper">
                            <label for="email">Email</label>
                            <input name="email" type="text" class="form-control" required>
                        </div>
                        <div class="form-wrapper">
                            <label for="phone">Phone Number</label>
                            <input name='phone' type="number" class="form-control" required>
                        </div>
                    </div>
					<div class="form-wrapper">
						<label for="gender">Gender</label>
						<div style="display: flex; gap: 10px;">
							<label>
								<input name="gender" type="radio" value="male"> Male
							</label>
							<label>
								<input name="gender" type="radio" value="female"> Female
							</label>
							<label>
								<input name="gender" type="radio" value="other"> Other
							</label>
						</div>
					</div>
					<div class="form-wrapper">
						<label for="addrs">Address</label>
						<input name="addrs" type="text" class="form-control" required>
					</div>
                    <div class="form-wrapper">
						<label for="reason">Reason</label>
						<input name="reason" type="text" class="form-control" required>
					</div>

					<div class="form-wrapper">
						<label for="group">Blood Group</label>
						<select name="group" id="blood-group" class="form-control">
							<option value="">Select Blood Group</option>
							<option value="A+">A+</option>
							<option value="A-">A-</option>
							<option value="B+">B+</option>
							<option value="B-">B-</option>
							<option value="O+">O+</option>
							<option value="O-">O-</option>
							<option value="AB+">AB+</option>
							<option value="AB-">AB-</option>
						</select>
					</div>
                    <div class="form-wrapper">
						<label for="qunty">Quantity</label>
						<input name="qunty" type="text" class="form-control" required>
					</div>
					<button type="submit">Request</button>


				</form>

			</div>
		</div>

	<script>
		const otherCheckbox = document.getElementById('other-condition-checkbox');
		const otherInput = document.getElementById('other-condition-input');

		otherCheckbox.addEventListener('change', function () {
			if (this.checked) {
				otherInput.style.display = 'block';
			} else {
				otherInput.style.display = 'none';
			}
		});
	</script>

	</body>
</html>
