<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Web Component</title>
    {% load static %}
    <link href="{% static 'style.css'%}" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js'></script>
</head>
    <body>
        <div class="container">
            <!-- Breadcrumb -->
            <br><br><br><br><br><br><br><br><br>
              <nav aria-label="breadcrumb" class="main-breadcrumb">
                <ol class="breadcrumb">
                  <li class="breadcrumb-item"><a href="/adminhome">Home</a></li>
                  <li class="breadcrumb-item"><a href="/inventorylist">Inventory List</a></li>
                </ol>
              </nav>
              <!-- /Breadcrumb -->

            <div class="table-container">
                <table class="table">
                    <thead class="table-header">
                        <tr class="table-header-row">

                            <th class="key-heading">Blood Group</th>
                            <th class="status-heading">Quantity</th>
                            <th class="price-heading">Status</th>
                            <th class="price-heading">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for invent in inventory %}
                            <tr>
                                <td>{{ invent.blood_type }}</td>
                                <td>{{ invent.available_qnty }}</td>
                                <td>
                                    <span
                                        style="color: {% if invent.available_qnty < 1 %} red
                                            {% else %} green
                                            {% endif %};">
                                        Level
                                    </span>
                                </td>
                                <td>
                                    <a href="collect/{{invent.id}}" class="filter-btn" >Collect</a>
                                    <a href="supply/{{invent.id}}" class="filter-btn">Supply</a>
                                </td>
                            </tr>
                        {% endfor %}

                    </tbody>
                </table>
            </div><br>
        </div>
    </body>
</html>
